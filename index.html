<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Library</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #fafafb;
    --surface: #ffffff;
    --tile: #f3f3f5;
    --border: #e6e6ea;
    --border-strong: #d4d4da;
    --text: #18181b;
    --muted: #6e6e78;
    --accent: #5e6ad2;
    --radius: 10px;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1280px; margin: 0 auto; padding-inline: 24px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(250, 250, 251, 0.92);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .bar { display: flex; align-items: center; gap: 24px; padding-block: 20px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .count { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .search { position: relative; margin-left: auto; width: 100%; max-width: 320px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    transition: border-color .15s;
  }
  .search input::placeholder { color: #9a9aa3; }
  .search input:hover { border-color: var(--border-strong); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(94, 106, 210, .15); }

  /* Grid */
  main { padding-block: 28px 64px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(0, 0, 0, .04); }
  .thumb {
    display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 0; cursor: zoom-in;
    background: var(--tile); border-bottom: 1px solid var(--border);
  }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .meta { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; min-height: 44px; }
  .name { flex: 1; min-width: 0; display: flex; font-size: 13px; white-space: nowrap; }
  .name .head { overflow: hidden; text-overflow: ellipsis; }
  .name .tail { flex: none; }

  .icon-btn {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    color: var(--muted); cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--tile); color: var(--text); border-color: var(--border); }

  .empty { padding: 80px 0; text-align: center; color: var(--muted); }

  /* Preview */
  dialog {
    width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    padding: 0; border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface); color: var(--text);
    box-shadow: 0 24px 64px rgba(0, 0, 0, .16);
  }
  dialog::backdrop { background: rgba(24, 24, 27, .45); }
  .preview { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; background: var(--tile); padding: 16px; }
  .stage img { max-width: 100%; max-height: calc(100vh - 160px); object-fit: contain; border-radius: 4px; }
  .actions { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .actions .info { flex: 1; min-width: 160px; }
  .actions .name { display: block; font-weight: 500; font-size: 14px; white-space: normal; overflow-wrap: anywhere; }
  .actions .sub { color: var(--muted); font-size: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--tile); border-color: var(--border-strong); }
  .btn.primary { background: var(--text); border-color: var(--text); color: #fff; }
  .btn.primary:hover { background: #2c2c31; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 20; transform: translate(-50%, 8px);
    padding: 8px 14px; border-radius: 8px; background: var(--text); color: #fff; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 640px) {
    .wrap { padding-inline: 16px; }
    .bar { flex-wrap: wrap; gap: 12px; padding-block: 16px; }
    .search { max-width: none; }
    main { padding-block-start: 20px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .meta { padding-left: 10px; }
    .name { font-size: 12px; }
    .actions { padding: 12px; }
    .actions .btn { flex: 1; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div>
      <h1>Image Library</h1>
      <p class="count" id="count" aria-live="polite">Loading…</p>
    </div>
    <label class="search">
      <span class="sr-only">Search images by filename</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search by filename" autocomplete="off" spellcheck="false">
    </label>
  </div>
</header>

<main class="wrap">
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden></p>
</main>

<dialog id="dialog" aria-labelledby="p-name">
  <div class="preview">
    <div class="stage"><img id="p-img" alt=""></div>
    <div class="actions">
      <div class="info">
        <span class="name" id="p-name"></span>
        <span class="sub" id="p-sub"></span>
      </div>
      <button class="btn primary" id="p-copy" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        Copy image URL
      </button>
      <a class="btn" id="p-download" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        Download
      </a>
      <button class="btn" id="p-close" type="button" aria-label="Close preview">Close</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const grid = $("grid"), count = $("count"), search = $("search"), empty = $("empty");
  const dialog = $("dialog"), pImg = $("p-img"), pName = $("p-name"), pSub = $("p-sub");
  const pDownload = $("p-download"), toast = $("toast");

  let images = [];
  let visible = [];
  let current = -1;

  // Encode each path segment so spaces and special characters work in URLs.
  const relUrl = (path) => path.split("/").map(encodeURIComponent).join("/");
  const absUrl = (path) => new URL(relUrl(path), document.baseURI).href;

  const formatSize = (bytes) =>
    bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB";

  const copyIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';

  let toastTimer;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    showToast("Link copied");
  }

  function render() {
    const frag = document.createDocumentFragment();
    images.forEach((img, i) => {
      const li = document.createElement("li");
      li.className = "card";
      li.innerHTML =
        '<button class="thumb" type="button"><img loading="lazy" decoding="async" alt=""></button>' +
        '<div class="meta"><span class="name"><span class="head"></span><span class="tail"></span></span>' +
        '<button class="icon-btn" type="button">' + copyIcon + "</button></div>";
      const thumb = li.querySelector(".thumb");
      const pic = li.querySelector("img");
      const name = li.querySelector(".name");
      const copyBtn = li.querySelector(".icon-btn");

      pic.src = relUrl(img.path);
      pic.alt = img.name;
      // Middle ellipsis: keep the end of the filename (e.g. frame number) visible.
      const cut = Math.max(0, img.name.length - 12);
      name.firstChild.textContent = img.name.slice(0, cut);
      name.lastChild.textContent = img.name.slice(cut);
      name.title = img.path;
      thumb.setAttribute("aria-label", "Preview " + img.name);
      copyBtn.setAttribute("aria-label", "Copy link to " + img.name);
      copyBtn.title = "Copy image URL";

      thumb.addEventListener("click", () => open(i));
      copyBtn.addEventListener("click", () => copy(absUrl(img.path)));
      img.el = li;
      frag.appendChild(li);
    });
    grid.appendChild(frag);
    filter();
  }

  function filter() {
    const q = search.value.trim().toLowerCase();
    visible = [];
    images.forEach((img, i) => {
      const match = !q || img.path.toLowerCase().includes(q);
      img.el.hidden = !match;
      if (match) visible.push(i);
    });
    const total = images.length + (images.length === 1 ? " image" : " images");
    count.textContent = q ? visible.length + " of " + total : total;
    empty.hidden = visible.length > 0;
    empty.textContent = images.length ? "No images match “" + search.value.trim() + "”." : "No images yet.";
  }

  function open(i) {
    const img = images[i];
    current = i;
    pImg.src = relUrl(img.path);
    pImg.alt = img.name;
    pName.textContent = img.name;
    pSub.textContent = formatSize(img.size) + (img.path.includes("/") ? " · " + img.path : "");
    pDownload.href = relUrl(img.path);
    pDownload.setAttribute("download", img.name);
    if (!dialog.open) dialog.showModal();
  }

  function step(dir) {
    const pos = visible.indexOf(current);
    if (pos === -1 || !visible.length) return;
    open(visible[(pos + dir + visible.length) % visible.length]);
  }

  $("p-copy").addEventListener("click", () => copy(absUrl(images[current].path)));
  $("p-close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });
  dialog.addEventListener("close", () => { pImg.removeAttribute("src"); images[current]?.el.querySelector(".thumb").focus(); });
  dialog.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });

  search.addEventListener("input", filter);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== search && !dialog.open) { e.preventDefault(); search.focus(); }
  });

  fetch("images.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => { images = data.images || []; render(); })
    .catch(() => {
      count.textContent = "Couldn’t load the image list";
      empty.hidden = false;
      empty.textContent = "The image list (images.json) is missing. It is created automatically when the site is published.";
    });
})();
</script>
</body>
</html>
